<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>okonomi (お好み) - App Portal</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151d2f;
      --card-hover: #1e293b;
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(56, 189, 248, 0.4);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.15);
      --danger: #f87171;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      padding: 2.5rem 1.5rem;
      line-height: 1.6;
    }
    .container {
      max-width: 960px;
      margin: 0 auto;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .brand-icon {
      font-size: 1.8rem;
    }
    .brand-title {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .brand-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .nav-actions {
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }
    .btn-lock {
      background: rgba(248, 113, 113, 0.12);
      color: var(--danger);
      border: 1px solid rgba(248, 113, 113, 0.25);
      padding: 0.5rem 0.9rem;
      border-radius: 8px;
      font-size: 0.825rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.15s ease;
    }
    .btn-lock:hover {
      background: var(--danger);
      color: #0b0f19;
    }
    .hero {
      margin-bottom: 2rem;
    }
    .search-wrapper {
      position: relative;
      margin-bottom: 2rem;
    }
    .search-input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.85rem 1rem 0.85rem 2.75rem;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .search-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 1rem;
    }
    .app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
    }
    .app-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .app-card:hover {
      transform: translateY(-2px);
      border-color: var(--border-hover);
      box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.4);
    }
    .card-top {
      margin-bottom: 1rem;
    }
    .card-icon {
      font-size: 1.75rem;
      margin-bottom: 0.75rem;
    }
    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 0.35rem;
      color: var(--text);
    }
    .card-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
    }
    .card-slug {
      font-family: ui-monospace, monospace;
      color: var(--accent);
    }
    .arrow {
      color: var(--accent);
      font-weight: bold;
    }
    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
      display: none;
    }
    footer {
      margin-top: 4rem;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      padding-top: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="top-bar">
      <div class="brand">
        <div class="brand-icon">🍱</div>
        <div>
          <h1 class="brand-title">okonomi (お好み)</h1>
          <p class="brand-sub">Private Hub & Dashboards</p>
        </div>
      </div>
      <div class="nav-actions">
        <button id="hub-lock-btn" class="btn-lock">🔒 Lock Hub</button>
      </div>
    </header>

    <div class="search-wrapper">
      <span class="search-icon">🔍</span>
      <input type="text" id="app-search" class="search-input" placeholder="Search apps...">
    </div>

    <main>
      <div class="app-grid" id="app-grid">
        <!-- APP_CARDS_PLACEHOLDER -->
      </div>
      <div class="empty-state" id="empty-state">
        <p>No applications match your search query.</p>
      </div>
    </main>

    <footer>
      <p>Built with zero-leak encryption · Served via GitHub Pages</p>
    </footer>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const lockBtn = document.getElementById("hub-lock-btn");
      if (lockBtn) {
        lockBtn.addEventListener("click", () => {
          localStorage.removeItem("okonomi_key");
          localStorage.removeItem("okonomi_salt");
          location.reload();
        });
      }

      const searchInput = document.getElementById("app-search");
      const grid = document.getElementById("app-grid");
      const emptyState = document.getElementById("empty-state");
      const cards = document.querySelectorAll(".app-card");

      if (searchInput && cards.length > 0) {
        searchInput.addEventListener("input", (e) => {
          const query = e.target.value.toLowerCase().trim();
          let visibleCount = 0;

          cards.forEach(card => {
            const title = card.getAttribute("data-title")?.toLowerCase() || "";
            const desc = card.getAttribute("data-desc")?.toLowerCase() || "";
            const slug = card.getAttribute("data-slug")?.toLowerCase() || "";

            if (!query || title.includes(query) || desc.includes(query) || slug.includes(query)) {
              card.style.display = "flex";
              visibleCount++;
            } else {
              card.style.display = "none";
            }
          });

          if (emptyState) {
            emptyState.style.display = visibleCount === 0 ? "block" : "none";
          }
        });
      }
    });
  </script>
</body>
</html>
